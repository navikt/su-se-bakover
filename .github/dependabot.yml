version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    ignore:
      # Versions follow the Postgres version and should be updated manually
      - dependency-name: io.zonky.test.postgres:embedded-postgres-binaries-bom
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  # Default it only picks up .github/workflows, but we put custom actions in .github/actions.
  # Using `directories` with a glob so the same action across every directory is grouped
  # into a single PR instead of one PR per directory.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    # Group each action across all directories into one PR, so the same bump in
    # multiple action folders doesn't open several duplicate PRs.
    groups:
      actions-checkout:
        patterns:
          - "actions/checkout"
      actions-setup-java:
        patterns:
          - "actions/setup-java"
      github-codeql-action:
        patterns:
          - "github/codeql-action*"
      gradle-actions:
        patterns:
          - "gradle/actions*"
      nais-deploy:
        patterns:
          - "nais/deploy*"
      nais-docker-build-push:
        patterns:
          - "nais/docker-build-push"

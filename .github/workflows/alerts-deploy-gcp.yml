name: Deploy alerts to NAIS GCP(alerts) for loki/grafana

on:
  push:
    branches:
      - master
    paths:
      - 'alerts.yml'
      - '.github/workflows/alerts-deploy-gcp.yml'
  workflow_dispatch:

jobs:
  deploy_to_dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for push-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Installer Nais CLI
        uses: nais/setup@v1
        with:
          team: supstonad
      - name: Deploy to dev
        env:
          LOGS_URL_LOKI: https://grafana.nav.cloud.nais.io/goto/efq0y6eulatc0c?orgId=1
        run: |
          sed \
            -e "s|{{LOGS_URL_LOKI}}|${LOGS_URL_LOKI}|g" \
            alerts.yml > "$RUNNER_TEMP/alerts-dev.yml"
          nais apply "$RUNNER_TEMP/alerts-dev.yml" --environment dev-gcp --wait
  deploy_to_prod:
    name: Deploy to prod
    if: ${{ false }}
    permissions:
      contents: read
      id-token: write # needed for push-image
    uses: navikt/su-se-bakover/.github/workflows/reusable-deploy.yml@master
    with:
      var: SLACK_ALERTS_CHANNEL=#su_alerts_prod,LOGS_URL_LOKI=https://grafana.nav.cloud.nais.io/goto/afvuvs1dzlk3ka?orgId=default
      cluster: prod-gcp
      resource: alerts.yml
name: Build and deploy to preprod on push to master

on:
  push:
    branches:
      - master

permissions: {}
jobs:
  build-test-push-image:
    name: Build, test and push image
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: read
      id-token: write # needed for push-image
    outputs:
      image: ${{ steps.push-image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        uses: ./.github/actions/build-and-test
      - name: Push image
        id: push-image
        uses: ./.github/actions/push-image
        with:
          image_suffix: 'app'
  submit-dependency-graph:
    name: Submit dependency graph
    permissions:
      contents: 'write'
    uses: navikt/su-se-bakover/.github/workflows/reusable-submit-dependency-graph.yml@master
  deploy-to-dev-gcp:
    needs: build-test-push-image
    name: Deploy to dev gcp
    permissions:
      contents: read
      id-token: write
    uses: navikt/su-se-bakover/.github/workflows/reusable-deploy.yml@master
    with:
      cluster: dev-gcp
      var: image=${{ needs.build-test-push-image.outputs.image }}
      resource: .nais/dev-gcp.yaml
  deploy_to_prod:
    needs: [build-test-push-image, deploy-to-dev-gcp]
    name: Deploy to prod
    permissions:
      contents: read
      id-token: write
    uses: navikt/su-se-bakover/.github/workflows/reusable-deploy.yml@master
    with:
      var: image=${{ needs.build-test-push-image.outputs.image }}
      cluster: prod-gcp
      resource: .nais/prod-gcp.yaml

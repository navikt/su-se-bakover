# requires permission contents: 'write'

name: 'Submit dependecy graph'
description: 'Submit dependecy graph'
runs:
  using: "composite"

  steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-java
    - name: Submit dependency graph
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        gradle-version: wrapper
        dependency-graph: generate-and-submit
    - shell: bash
      env:
        GITHUB_PACKAGES_READ_TOKEN: ${{ github.token }}
      run: ./gradlew assemble testClasses

name: 'Build and test'
description: 'Checkout, download java and assemble and test'

inputs:
  gradle-arguments:
    required: false
    description: 'Gradle arguments to pass to gradle build'
    default: build
  github-token:
    required: false
    default: ${{ github.token }}
    description: "Github token"
  reader-token:
    required: false
    description: "Readre token"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-java
    - name: Run gradle build
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      with:
        gradle-version: wrapper
        cache-provider: basic
        cache-read-only: false
        gradle-home-cache-cleanup: true
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        READER_TOKEN: ${{ inputs.reader-token }}
      run: ./gradlew ${{ inputs.gradle-arguments }} --build-cache
